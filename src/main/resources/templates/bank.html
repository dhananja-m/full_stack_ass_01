<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bank Transfer System</title>
</head>
<body>
    <h1>Bank Transfer System Dashboard</h1>

    <!-- Success/Error Messages -->
    <div th:if="${message}" style="color: green;" th:text="${message}"></div>
    <div th:if="${error}" style="color: red;" th:text="${error}"></div>

    <h2>Total Balance: <span th:text="${totalBalance}">0.00</span> LKR</h2>

    <h3>Customers</h3>
    <table border="1">
        <thead>
            <tr>
                <th>Account Number</th>
                <th>Name</th>
                <th>Email</th>
                <th>Balance</th>
            </tr>
        </thead>
        <tbody>
            <tr th:for="customer : ${customers}">
                <td th:text="${customer.accountNumber}"></td>
                <td th:text="${customer.fullName}"></td>
                <td th:text="${customer.email}"></td>
                <td th:text="${customer.balance}"></td>
            </tr>
        </tbody>
    </table>

    <h3>Transfer Money</h3>
    <form th:action="@{/transfer}" th:object="${transferRequest}" method="post">
        <label>From Account:</label>
        <input type="text" th:field="*{fromAccount}" required /><br/>

        <label>To Account:</label>
        <input type="text" th:field="*{toAccount}" required /><br/>

        <label>Amount:</label>
        <input type="number" step="0.01" th:field="*{amount}" required /><br/>

        <label>
            <input type="checkbox" th:field="*{simulateFailure}" /> Simulate System Failure
        </label><br/>

        <button type="submit">Transfer</button>
    </form>
</body>
</html>
